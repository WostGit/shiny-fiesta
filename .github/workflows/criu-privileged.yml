name: CRIU Privileged Feature Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  privileged-criu:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Install CRIU
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:criu/ppa
          sudo apt-get update
          sudo apt-get install -y criu build-essential python3 iproute2

          echo "=== CRIU version ==="
          criu --version
          echo
          echo "=== criu check ==="
          sudo criu check
          sudo criu check --extra || true

      - name: Create workspace
        run: mkdir -p /tmp/criu-tests && cd /tmp/criu-tests

      # ---------------------------------------------------------------
      # Test 1 – Basic dump + restore (most important)
      # ---------------------------------------------------------------
      - name: "1. Basic dump/restore"
        run: |
          set -euo pipefail
          cd /tmp/criu-tests
          rm -rf basic && mkdir basic

          # Clean long-running process
          setsid bash -c 'echo READY > /tmp/basic.marker; while true; do sleep 1; done' </dev/null >/dev/null 2>&1 &
          sleep 0.3
          PID=$(pgrep -f "basic.marker" | head -1)
          echo "PID = $PID"
          test -n "$PID"

          sudo criu dump -t "$PID" -D basic --shell-job -v3
          echo "Dump OK"

          # Original process is gone after successful dump
          sudo criu restore -D basic --shell-job -d -v3
          sleep 0.8

          if pgrep -f "basic.marker" >/dev/null; then
            echo "✓ Basic dump/restore succeeded"
          else
            echo "✗ Restore did not bring process back"
            exit 1
          fi

      # ---------------------------------------------------------------
      # Test 2 – Shared memory + file lock
      # ---------------------------------------------------------------
      - name: "2. Shared memory + file lock"
        run: |
          set -euo pipefail
          cd /tmp/criu-tests
          rm -rf shm && mkdir shm

          cat > /tmp/shm_test.c << 'EOF'
          #define _GNU_SOURCE
          #include <stdio.h>
          #include <unistd.h>
          #include <fcntl.h>
          #include <sys/mman.h>
          #include <sys/file.h>
          #include <string.h>
          int main(void) {
              int fd = open("/tmp/criu-lock", O_RDWR|O_CREAT, 0644);
              flock(fd, LOCK_EX);
              int s = shm_open("/criu_test_shm", O_CREAT|O_RDWR, 0600);
              ftruncate(s, 4096);
              void *p = mmap(NULL, 4096, PROT_READ|PROT_WRITE, MAP_SHARED, s, 0);
              strcpy(p, "hello-criu-shm");
              printf("READY\n"); fflush(stdout);
              while (1) sleep(1);
          }
          EOF

          gcc -o /tmp/shm_test /tmp/shm_test.c -lrt
          /tmp/shm_test > /tmp/shm.out 2>&1 &
          sleep 0.4
          PID=$(pgrep -f shm_test | head -1)
          echo "PID = $PID"
          test -n "$PID"

          sudo criu dump -t "$PID" -D shm --shell-job -v3
          echo "✓ Shared-memory + lock dump succeeded"

      # ---------------------------------------------------------------
      # Test 3 – Established TCP (dump only – restore is harder)
      # ---------------------------------------------------------------
      - name: "3. Established TCP dump"
        run: |
          set -euo pipefail
          cd /tmp/criu-tests
          rm -rf tcp && mkdir tcp

          python3 -c '
          import socket, time, os
          s = socket.socket()
          s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          s.bind(("127.0.0.1", 9876))
          s.listen(1)
          print("SERVER_READY", flush=True)
          conn, _ = s.accept()
          print("CONNECTED", flush=True)
          while True:
              data = conn.recv(32)
              if not data: break
              conn.sendall(b"PONG")
              time.sleep(0.2)
          ' > /tmp/tcp_server.log 2>&1 &
          SERVER_PID=$!
          sleep 0.5

          python3 -c '
          import socket, time
          c = socket.socket()
          c.connect(("127.0.0.1", 9876))
          for _ in range(10):
              c.sendall(b"PING")
              print(c.recv(32))
              time.sleep(0.15)
          ' > /tmp/tcp_client.log 2>&1 &
          sleep 0.8

          echo "Server PID = $SERVER_PID"
          if sudo criu dump -t "$SERVER_PID" -D tcp --shell-job --tcp-established -v3; then
            echo "✓ TCP established dump succeeded"
          else
            echo "TCP dump failed (can be environment-dependent)"
            # do not fail the whole job for TCP
            exit 0
          fi

      # ---------------------------------------------------------------
      # Test 4 – Simple PID + mount namespace
      # ---------------------------------------------------------------
      - name: "4. Simple namespaces"
        run: |
          set -euo pipefail
          cd /tmp/criu-tests
          rm -rf ns && mkdir ns

          # Run a process inside new PID + mount namespaces
          sudo unshare -p -m --fork --mount-proc \
            bash -c 'echo NS_READY > /tmp/ns.marker; while true; do sleep 1; done' &
          sleep 0.6

          PID=$(pgrep -f "ns.marker" | head -1 || true)
          if [ -z "$PID" ]; then
            echo "Could not find namespaced process (expected on some runners)"
            exit 0
          fi
          echo "Namespaced PID = $PID"

          if sudo criu dump -t "$PID" -D ns --shell-job -v3; then
            echo "✓ Namespace dump succeeded"
          else
            echo "Namespace dump failed (complex on shared runners)"
            exit 0
          fi

      # ---------------------------------------------------------------
      # Summary
      # ---------------------------------------------------------------
      - name: Summary
        if: always()
        run: |
          echo "=============================================="
          echo " CRIU Privileged Feature Tests – Summary"
          echo "=============================================="
          criu --version || true
          echo
          echo "Images left in /tmp/criu-tests:"
          find /tmp/criu-tests -maxdepth 2 -type d 2>/dev/null || true
          echo
          echo "Key result: if Test 1 (Basic dump/restore) passed,"
          echo "privileged CRIU is working on this runner."
