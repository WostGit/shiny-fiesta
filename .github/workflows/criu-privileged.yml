name: Docker Checkpoint Support Test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  docker-checkpoint-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Install CRIU
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:criu/ppa
          sudo apt-get update
          sudo apt-get install -y criu

          echo "=== CRIU version ==="
          criu --version
          sudo criu check

      - name: Enable Docker experimental features
        run: |
          set -euo pipefail

          # Enable experimental mode (required for checkpoint)
          echo '{"experimental": true}' | sudo tee /etc/docker/daemon.json

          # Restart Docker
          sudo systemctl restart docker
          sleep 3

          echo "=== Docker info (experimental) ==="
          docker info | grep -iE 'experimental|runc|criu' || true
          docker version

      - name: Test 1 – Basic container checkpoint + restore
        id: basic
        run: |
          set -euo pipefail

          echo ">>> Starting test container"
          docker run -d --name looper busybox \
            sh -c 'i=0; while true; do echo $i; i=$((i+1)); sleep 1; done'

          sleep 2
          echo ">>> Logs before checkpoint:"
          docker logs looper | tail -5

          echo ">>> Creating checkpoint"
          if docker checkpoint create looper cp1; then
            echo "Checkpoint create: SUCCESS"
          else
            echo "Checkpoint create: FAILED"
            docker logs looper || true
            exit 1
          fi

          echo ">>> Container status after checkpoint:"
          docker ps -a --filter name=looper

          echo ">>> Restoring from checkpoint"
          if docker start --checkpoint cp1 looper; then
            echo "Restore: SUCCESS"
          else
            echo "Restore: FAILED"
            exit 1
          fi

          sleep 2
          echo ">>> Logs after restore (should continue counting):"
          docker logs looper | tail -8

          # Simple verification that the process continued
          if docker logs looper | tail -3 | grep -qE '[0-9]+'; then
            echo "✓ Basic checkpoint/restore appears to work"
            echo "basic_ok=true" >> $GITHUB_OUTPUT
          else
            echo "✗ Logs do not look continuous"
            exit 1
          fi

      - name: Test 2 – Checkpoint with --leave-running
        run: |
          set -euo pipefail

          docker rm -f looper2 2>/dev/null || true
          docker run -d --name looper2 busybox \
            sh -c 'i=0; while true; do echo $i; i=$((i+1)); sleep 1; done'
          sleep 2

          echo ">>> Checkpoint with --leave-running"
          if docker checkpoint create --leave-running looper2 cp-leave; then
            echo "✓ --leave-running works"
            docker ps --filter name=looper2
          else
            echo "✗ --leave-running failed"
            exit 1
          fi

      - name: Test 3 – Network sensitivity (common failure point)
        continue-on-error: true
        run: |
          set -euo pipefail

          docker rm -f nettest 2>/dev/null || true

          # Default bridge network (often problematic)
          docker run -d --name nettest busybox \
            sh -c 'i=0; while true; do echo $i; i=$((i+1)); sleep 1; done'
          sleep 2

          echo ">>> Trying checkpoint on default bridge network"
          if docker checkpoint create nettest cp-net; then
            echo "✓ Bridge network checkpoint succeeded"
            docker start --checkpoint cp-net nettest || true
          else
            echo "✗ Bridge network checkpoint failed (this is a known limitation)"
            echo "Many users need --network=host for reliable checkpointing"
          fi

      - name: Cleanup
        if: always()
        run: |
          docker rm -f looper looper2 nettest 2>/dev/null || true
          docker checkpoint ls looper 2>/dev/null || true

      - name: Final verdict
        if: always()
        run: |
          echo "======================================================"
          echo " Docker Checkpoint Support on GitHub Actions"
          echo "======================================================"
          echo
          echo "CRIU version: $(criu --version 2>/dev/null || echo 'not found')"
          echo "Docker experimental: $(docker info 2>/dev/null | grep -i experimental || echo 'unknown')"
          echo
          if [ "${{ steps.basic.outputs.basic_ok }}" = "true" ]; then
            echo "✅ RESULT: Basic Docker checkpoint/restore WORKS on this runner"
            echo
            echo "Notes:"
            echo "  - Experimental mode must be enabled"
            echo "  - CRIU must be installed on the host"
            echo "  - Default bridge networking is often unreliable"
            echo "  - Feature remains experimental in Docker"
          else
            echo "❌ RESULT: Basic Docker checkpoint/restore FAILED"
            echo "Check the logs above for the exact error."
          fi
